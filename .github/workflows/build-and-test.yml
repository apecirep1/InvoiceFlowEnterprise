name: Build and Test
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet restore InvoiceFlow.sln
      - run: dotnet build InvoiceFlow.sln -c Release --no-restore
      - run: dotnet test InvoiceFlow.sln -c Release --no-build --verbosity normal
